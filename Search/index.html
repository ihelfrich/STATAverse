<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Search | STATAverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/site.css" />
  </head>
  <body class="page-zero" data-search-page data-index-src="../assets/data/site-index.json" data-base="../">
    <header class="site-header">
            <nav class="nav">
        <a class="brand" href="../index.html">STATAverse</a>
        <div class="nav-links">
          <a href="../ScriptLibrary/">Scripts</a>
          <a href="../CodeLibrary/">Code Library</a>
          <a href="../MethodLab/">Method Lab</a>
          <a href="../Topics/">Topics</a>
          <a href="../RealData/">Real Data</a>
          <a href="../Readings/">Readings</a>
          <a href="../Search/">Search</a>
          <a href="../Workspace/">Workspace</a>
          <a href="../ZeroToHero/">Zero-to-Hero</a>
          <a href="../STATAForBusiness/">Stata for Business</a>
          <a href="../index.html#about">About</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero hero-compact">
        <div class="hero-copy">
          <span class="eyebrow">Site search</span>
          <h1>Find modules, datasets, scripts, and projects</h1>
          <p class="lead">
            Search across the full STATAverse library. Filter by type, tags, or level.
          </p>
          <div class="filter-bar">
            <input
              id="site-search"
              class="search-input"
              type="search"
              placeholder="Search anything..."
              aria-label="Search STATAverse"
            />
            <div class="filter-chips" data-site-filters>
              <button class="filter-chip active" data-filter="all" type="button">All</button>
              <button class="filter-chip" data-filter="module" type="button">Modules</button>
              <button class="filter-chip" data-filter="dataset" type="button">Datasets</button>
              <button class="filter-chip" data-filter="project" type="button">Projects</button>
              <button class="filter-chip" data-filter="script" type="button">Scripts</button>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="script-grid" data-site-results></div>
      </section>
    </main>

    <footer class="site-footer">
      <div>STATAverse | Search</div>
    </footer>

    <script src="../assets/js/site.js"></script>
  </body>
</html>
